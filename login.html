<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Barangay Admin Sign in — BRGYWEBSAAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css?v=20260831-login12">
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">BARANGAY ADMIN LOGIN</p>
      <h1 id="barangay-title">Barangay Admin Sign in</h1>
      <p id="barangay-subtitle" class="muted">This page is for Barangay Admin accounts only.</p>
      <div id="login-form-wrap">
        <form id="login-form" novalidate>
          <label for="email">Email<input id="email" type="email" required autocomplete="username" inputmode="email"></label>
          <label for="password">Password<input id="password" type="password" required autocomplete="current-password"></label>
          <button id="login-button" type="submit">Sign in as Barangay Admin</button>
          <p id="login-status" class="status" aria-live="polite" hidden></p>
        </form>
        <div id="signup-wrap" class="mt-3 text-center">
          <a id="signup-link" href="barangay-signup.html">Request Barangay Admin access</a>
        </div>
      </div>
      <div class="mt-3 text-center">
        <a href="superadmin-login.html" class="btn btn-outline-primary btn-sm">Super Admin Sign in</a>
      </div>
    </section>
  </main>
  <script type="module" src="js/login.js?v=20260831-login12"></script>
</body>
</html>
