<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BRGYWEBSAAS Super Admin Login">
  <title>Super Admin Sign in — BRGYWEBSAAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css?v=20260831-index-superadmin1">
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">BRGYWEBSAAS</p>
      <p class="mb-2"><span class="badge text-bg-primary">SUPER ADMIN LOGIN</span></p>
      <h1>Super Admin Sign in</h1>
      <p class="muted">Authorized Super Admin accounts only.</p>
      <form id="superadmin-login-form" novalidate>
        <label for="email">Email<input id="email" type="email" required autocomplete="username" inputmode="email"></label>
        <label for="password">Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button id="login-button" type="submit">Sign in as Super Admin</button>
        <p id="login-status" class="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>
  <script type="module" src="js/superadmin-login.js?v=20260831-index-superadmin1"></script>
</body>
</html>
