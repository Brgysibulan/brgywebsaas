<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign up — BRGYWEBSAAS</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="css/app.css?v=20260831-signup2"></head>
<body><main class="shell"><section class="card"><p class="eyebrow">BRGYWEBSAAS</p><h1 id="signup-title">Barangay Admin Sign up</h1><p id="signup-subtitle" class="muted">Choose the barangay you want to administer. Super Admin approval is required before you can sign in.</p><form id="signup-form" novalidate><label for="barangay">Barangay<select id="barangay" required><option value="">Select a barangay…</option></select></label><label for="full-name">Full name<input id="full-name" required maxlength="120" autocomplete="name"></label><label for="email">Email<input id="email" type="email" required autocomplete="email" inputmode="email"></label><label for="password">Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label for="confirm-password">Confirm password<input id="confirm-password" type="password" required minlength="8" autocomplete="new-password"></label><button id="signup-button" type="submit">Submit for approval</button><p id="signup-status" class="status" aria-live="polite" hidden></p></form><p class="mt-3 text-center"><a id="back-login" href="login.html">Back to admin sign in</a></p></section></main><script type="module" src="js/barangay-signup.js?v=20260831-signup2"></script></body></html>
