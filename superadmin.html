<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin — BRGYWEBSAAS</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="css/app.css"></head><body><main class="shell"><section class="card"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap"><div><p class="eyebrow">BRGYWEBSAAS</p><h1>Barangay Management</h1><p id="welcome" class="muted"></p></div><button id="logout" type="button">Sign out</button></div><form id="barangay-form"><input type="hidden" id="barangay-id"><label>Barangay Name<input id="name" required maxlength="120"></label><label>Slug<input id="slug" required maxlength="120" pattern="[a-z0-9-]+" placeholder="e.g. barangay-name"></label><label>Municipality<input id="municipality" maxlength="120"></label><label>Province<input id="province" maxlength="120"></label><button id="save" type="submit">Add Barangay</button><button id="cancel" type="button" hidden>Cancel</button></form><p id="status" class="status" aria-live="polite"></p><label>Search<input id="search" type="search" placeholder="Search barangay…"></label><div id="barangays" class="status">Loading barangays…</div></section></main><script type="module" src="js/theme.js"></script><script type="module" src="js/superadmin.js"></script></body></html>
